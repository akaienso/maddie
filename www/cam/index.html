<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maddie Cam</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    /* Self-contained: this page deploys as its own worker (cam.maddie.dog).
       When the stream is ready, replace the .offline block with the player
       and keep this block as the error/offline state. */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #241d17;
      color: #ede4d9;
      font-family: "Nunito", system-ui, sans-serif;
      text-align: center;
    }
    a { color: oklch(0.74 0.11 55); }
    a:hover { color: oklch(0.82 0.11 55); }
    .offline { padding: 2rem 1.5rem; }
    .paw { font-size: 3rem; }
    h1 { font-weight: 900; font-size: 1.75rem; margin: 0.5rem 0 0.25rem; }
    p { margin: 0.25rem 0; color: #a89a8b; }
  </style>
</head>
<body>
  <main class="offline">
    <div class="paw" aria-hidden="true">&#128062;</div>
    <h1 id="msg">Oops. Maddie wandered off.</h1>
    <p>The cam is offline right now &mdash; check back soon.</p>
    <p><a href="https://maddie.dog">Meanwhile: photos</a></p>
  </main>
  <script>
    var MESSAGES = [
      'Oops. Maddie wandered off.',
      'Maddie is chasing a squirrel.',
      'Maddie is running with Oscar.',
      'Maddie is at the dog park.',
      'Maddie is mid-nap. Do not disturb.',
      'Maddie is out for a walk.',
      'Belly rub intermission. Back soon.',
      'Maddie is supervising snack preparation.'
    ];
    document.getElementById('msg').textContent = MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
  </script>
</body>
</html>
